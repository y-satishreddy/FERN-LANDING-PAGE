<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9EDE5" />
    <meta name="robots" content="noindex" />

    <title>Thank You | Fern</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/xfs6hlz.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    />

    <link rel="icon" href="assets/images/favicon.png" />

    <style>
      :root {
        --brand: #10322d;
        --moss: #517937;
        --accent: #54923f;
        --terracota: #833c24;
        --terracota-hover: #9b4d32;
        --clay: #d5a18a;
        --light: #fafbf8;
        --page-bg: #e9ede5;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "DM Sans", sans-serif;
        background: var(--page-bg);
        color: var(--brand);
      }

      /* Main Page */
      .thankyou-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(
          135deg,
          #10322d 0%,
          #174139 55%,
          #0b2924 100%
        );
      }

      /* Content Card */
      .content {
        width: 100%;
        max-width: 520px;
        padding: 48px 40px;
        text-align: center;
        background: #174139;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.16);
      }

      /* Logo */
      .logo {
        display: block;
        width: 120px;
        max-height: 90px;
        height: auto;
        object-fit: contain;
        margin: 0 auto 32px;
      }

      /* Heading */
      .heading {
        margin: 0;
        font-family: "Goldenbook", serif;
        font-size: 50px;
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        color: var(--light);
      }

      /* Divider */
      .divider {
        width: 42px;
        height: 1px;
        margin: 24px auto;
        background: var(--clay);
      }

      /* Description */
      .description {
        max-width: 400px;
        margin: 0 auto;
        color: rgba(250, 251, 248, 0.82);
        font-size: 16px;
        font-weight: 400;
        line-height: 1.7;
      }

      /* Buttons */
      .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .btn {
        min-width: 155px;
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 22px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }

      .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* Primary Button */
      .btn-primary {
        color: #fff;
        background: var(--terracota);
        border-color: var(--terracota);
      }

      .btn-primary:hover {
        background: var(--terracota-hover);
        border-color: var(--terracota-hover);
      }

      /* Secondary Button */
      .btn-secondary {
        color: var(--light);
        background: transparent;
        border-color: rgba(250, 251, 248, 0.35);
      }

      .btn-secondary:hover {
        color: var(--clay);
        border-color: var(--clay);
      }

      .btn:focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 4px;
      }

      /* Responsive */
      @media (max-width: 640px) {
        .thankyou-page {
          padding: 24px 16px;
        }

        .content {
          padding: 40px 24px;
        }

        .logo {
          width: 105px;
          max-height: 80px;
          margin-bottom: 28px;
        }

        .heading {
          font-size: 50px;
        }

        .divider {
          margin: 22px auto;
        }

        .description {
          font-size: 16px;
          line-height: 1.7;
        }

        .actions {
          flex-direction: column;
          gap: 12px;
          margin-top: 28px;
        }

        .btn {
          width: 100%;
          max-width: 280px;
          min-height: 48px;
        }
      }

      @media (max-width: 360px) {
        .content {
          padding: 36px 18px;
        }

        .actions {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="thankyou-page">
      <!-- Main Card -->
      <section class="content">
        <!-- Fern Logo -->
        <img
          src="assets/images/logowhite.png"
          class="logo"
          alt="Fern by Bonsai Housing"
        />

        <!-- Heading -->
        <h1 class="heading">Thank You</h1>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Message -->
        <p class="description">
          Thank you for reaching out to Fern. We're delighted to hear from you.
          Your enquiry has been received, and our team will connect with you
          shortly.
        </p>

        <!-- Actions -->
        <div class="actions">
          <a href="index.html" class="btn btn-primary">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
            Back to Home
          </a>

          <a
            href="https://fern.bonsaihousing.com/"
            target="_blank"
            class="btn btn-secondary"
          >
            Explore Fern

            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
